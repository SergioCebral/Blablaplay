<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlaBlaBla Play · A2 jugable</title>
<style>
:root{--yellow:#FFD400;--black:#0D0D0D;--paper:#F6F6F3;--white:#fff;--muted:#6c6c68;--green:#1f9d55;--red:#d9382e}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--black);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
button,input{font:inherit} button{cursor:pointer} .shell{max-width:1280px;margin:auto;padding:22px 28px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:42px}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900} .bla{background:var(--yellow);padding:9px 16px;border-radius:50%;font-size:17px}
.pill{background:var(--black);color:var(--yellow);border-radius:999px;padding:9px 14px;font-size:12px}
h1{font-size:clamp(46px,7vw,82px);line-height:.95;letter-spacing:-4px;margin:0 0 12px} .a2{background:var(--black);color:var(--yellow);border-radius:26px;padding:3px 17px 8px;display:inline-block}
.lead{font-family:Arial,sans-serif;color:var(--muted);font-size:17px;max-width:760px;margin:0 0 30px;line-height:1.5}
.unitGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px} .unit{border:2.5px solid var(--black);border-radius:28px;overflow:hidden;background:white;text-align:left;padding:0}
.unit:hover,.game:hover{box-shadow:0 9px 0 var(--yellow);transform:translateY(-2px)} .unitTop{background:var(--black);color:var(--yellow);padding:24px;display:flex;justify-content:space-between;align-items:center}
.unitNo{font-size:44px;font-weight:900} .unitIcon{font-size:37px} .unitBody{padding:19px 23px 23px} .unitBody b{display:block;font-size:23px;margin-bottom:7px} .unitBody span{font:14px Arial;color:var(--muted);line-height:1.4}
.back{border:2px solid var(--black);background:transparent;border-radius:999px;padding:10px 17px;font-weight:900;margin-bottom:24px}
.unitHeading{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:27px} .unitHeading h1{font-size:clamp(38px,6vw,65px)} .bigA2{background:var(--black);color:var(--yellow);font-size:44px;border-radius:25px;padding:13px 22px;font-weight:900}
.subtitle{font:16px Arial;color:var(--muted)} .games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.game{border:2.5px solid var(--black);border-radius:27px;overflow:hidden;background:white;text-align:left;padding:0;min-height:220px}
.gameVis{height:119px;background:var(--black);color:var(--yellow);display:flex;justify-content:center;align-items:center;position:relative;font-size:48px} .special .gameVis{background:var(--yellow);color:var(--black)}
.tag{position:absolute;left:12px;top:11px;background:var(--yellow);color:var(--black);border-radius:999px;padding:4px 8px;font-size:10px} .special .tag{background:var(--black);color:var(--yellow)}
.gameCopy{padding:17px 19px 20px} .gameCopy b{font-size:20px;display:block;margin-bottom:7px} .gameCopy span{font:13px Arial;color:var(--muted);line-height:1.4}
.playHead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:17px} .playTitle{font-size:clamp(29px,5vw,48px);font-weight:900;letter-spacing:-2px}
.counter{background:var(--black);color:var(--yellow);border-radius:999px;padding:9px 13px;font-size:13px}
.board{border:3px solid var(--black);border-radius:30px;background:white;padding:26px;box-shadow:0 10px 0 var(--yellow);min-height:360px}
.prompt{font-size:clamp(26px,4.5vw,44px);font-weight:900;line-height:1.1;margin:8px 0 22px} .smallPrompt{font:18px Arial;line-height:1.55;margin-bottom:18px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .answer{border:2px solid var(--black);background:white;border-radius:17px;padding:14px;text-align:left;font-weight:900;min-height:54px}
.answer:hover{background:#fff8cc} .answer.ok{background:#dff6e8;border-color:var(--green)} .answer.bad{background:#fde3e0;border-color:var(--red);opacity:.75}
.feedback{font:700 16px Arial;min-height:28px;margin-top:14px} .next{border:0;background:var(--black);color:var(--yellow);border-radius:999px;padding:12px 18px;font-weight:900;margin-top:13px}
.words{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px} .word{border:2px solid var(--black);border-radius:14px;padding:10px 13px;background:white;font-weight:900} .sentence{min-height:62px;border:2px dashed var(--black);border-radius:17px;padding:11px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.memory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px} .mcard{min-height:105px;border:0;border-radius:18px;background:var(--black);color:var(--yellow);font-weight:900;padding:9px;font-size:18px} .mcard.open,.mcard.done{background:var(--yellow);color:var(--black);border:2px solid var(--black)} .mcard.done{opacity:.55}
.code{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0} .letter{width:36px;height:42px;border:2px solid var(--black);border-radius:11px;display:grid;place-items:center;background:#fff;font-weight:900}
.progress{height:9px;border:2px solid var(--black);border-radius:999px;overflow:hidden;margin-top:20px} .progress>span{display:block;height:100%;background:var(--yellow)}
.result{text-align:center;padding:35px 10px} .result .big{font-size:64px} .result h2{font-size:34px;margin:10px 0}
.footer{border-top:2px solid var(--black);margin-top:45px;padding:24px 0 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;font:12px Arial;color:var(--muted)} .footer img{height:55px;width:auto}

.game{position:relative;overflow:hidden;margin-bottom:0}
.gameCopy{border-radius:0 0 25px 25px;background:var(--white)}
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.personCard{border:2px solid var(--black);border-radius:18px;background:#fff;padding:10px;text-align:center}
.personCard b{display:block;font-size:14px;margin-bottom:4px}

.personCard{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px 10px;background:#fffdf9}
.avatarSvg{width:150px;height:210px;display:block;margin:auto}
.personCard b{margin-top:8px}

.whoImg{
  width:150px;height:210px;object-fit:contain;display:block;margin:auto;
  image-rendering:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.03));
}
.personCard .charWrap{
  width:100%;height:225px;display:flex;align-items:flex-end;justify-content:center;
}
.whoImg.short{height:175px}
.whoImg.medium{height:210px}
.whoImg.tall{height:245px}
.personCard b{margin-top:8px;font-size:16px}

.personCard span{display:none!important}

.mapWrap{border:2px solid var(--black);border-radius:22px;background:#fff8cc;padding:14px;margin-bottom:18px}
.mapGrid{position:relative;height:240px;border:2px solid var(--black);border-radius:18px;background:
linear-gradient(90deg, transparent 31%, #111 31%, #111 34%, transparent 34%, transparent 64%, #111 64%, #111 67%, transparent 67%),
linear-gradient(transparent 31%, #111 31%, #111 34%, transparent 34%, transparent 64%, #111 64%, #111 67%, transparent 67%),
#f1f1ee}
.place{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--black);border-radius:12px;padding:6px 8px;font:12px Arial;font-weight:700}
.pinStart,.pinEnd{position:absolute;transform:translate(-50%,-50%);font-size:24px}
.mapLegend{display:flex;gap:14px;flex-wrap:wrap;font:13px Arial;margin-top:10px}
.officeTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.ticket{background:var(--yellow);border:2px solid var(--black);border-radius:18px;padding:12px 14px;text-align:center;min-width:110px}
.ticket b{display:block;font-size:28px}
.windowDesk{background:var(--black);color:var(--yellow);border-radius:18px;padding:14px 18px;font-size:22px;font-weight:900}
.officeBubble{background:#fff8cc;border:2px solid var(--black);border-radius:20px;padding:16px;font:18px Arial;line-height:1.45;margin-bottom:18px}
@media(max-width:900px){.roster{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}.mapGrid{height:200px}}

.hidden{display:none!important}
@media(max-width:900px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.shell{padding:17px 15px 0} .pill{display:none} .unitGrid,.games,.answers{grid-template-columns:1fr} .memory{grid-template-columns:repeat(3,minmax(0,1fr))} .unitHeading{display:block} .bigA2{display:inline-block;margin-top:10px} .board{padding:18px} h1{letter-spacing:-2px} .footer{flex-direction:column;align-items:flex-start}}
</style>
</head>

function complete(){
 count(`Ronda ${round+1} / 10`);let phrase=current.phrases[round];let words=phrase.replace(/[.¿?¡!,]/g,'').split(' ');let idx=Math.max(0,Math.min(words.length-1,Math.floor(words.length/2)));let correct=words[idx];let shown=phrase.replace(new RegExp('\\b'+correct.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'), '_____');
 let distract=sh(current.vocab.filter(v=>v.toLowerCase()!=correct.toLowerCase())).slice(0,2);let opts=sh([correct,...distract]);
 board.innerHTML=`<div class="prompt">${shown}</div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;answers(opts,correct,nextRound)
}
function response(){
 count(`Situación ${round+1} / 10`);let d=current.dialogs[round%current.dialogs.length],wrong=sh(U[(current.id+1)%10].dialogs.map(x=>x[1])).slice(0,2),opts=sh([d[1],...wrong]);
 board.innerHTML=`<div class="smallPrompt">La otra persona dice:</div><div class="prompt">“${d[0]}”</div><div class="smallPrompt"><b>¿Qué responderías?</b></div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;answers(opts,d[1],nextRound)
}
function errorGame(){
 count(`Ronda ${round+1} / 10`);
 let bank=current.errors.filter(e=>String(e[0]).trim()!==String(e[1]).trim());
 let e=bank[round%bank.length];
 function buildCloseDistractors(wrong, correct){
   const pools={
     1:['alta','baja','alegre','tímida','gafas','pelo corto','responsable','lleva'],
     2:['cabeza','rodilla','garganta','fiebre','mareado','tengo','estoy'],
     3:['frutería','panadería','botella','barra','kilo','paquete','docena'],
     4:['cine','fútbol','natación','siempre','nunca','a veces','parque'],
     5:['fiesta','tarta','globos','sábado','regalo','feliz','mesa'],
     6:['mercado','parque','izquierda','derecha','cerca','enfrente','biblioteca'],
     7:['biblioteca','patio','móvil','tutor','horario','recreo'],
     8:['móvil','archivo','enlace','contraseña','Wi-Fi','cargador'],
     9:['biblioteca','ventanilla','paquete','cita previa','formulario','firma'],
     10:['hospital','curso','responsable','puntual','profesor','trabajaré']
   };
   const fill=(sent, word)=>{let parts=sent.split(' '); if(parts.length>1){parts[parts.length-1]=word+(parts[parts.length-1].endsWith('.')?'.':''); return parts.join(' ')} return sent};
   let d1=fill(correct, pools[current.id][round%pools[current.id].length]);
   if(d1===correct||d1===wrong) d1=fill(wrong, pools[current.id][(round+1)%pools[current.id].length]);
   let d2=wrong;
   d2=d2.replace(' es ',' lleva ').replace(' está ',' lleva ').replace(' tengo ',' estoy ');
   if(d2===wrong||d2===correct) d2=fill(wrong, pools[current.id][(round+2)%pools[current.id].length]);
   return [d1,d2].filter((x,i,a)=>x!==correct && x!==wrong && a.indexOf(x)===i).slice(0,2);
 }
 let near=buildCloseDistractors(e[0],e[1]);
 while(near.length<2) near.push(bank[(round+near.length+1)%bank.length][1]);
 let opts=sh([e[1],...near.slice(0,2)]);
 board.innerHTML=`<div class="smallPrompt"><b>Frase incorrecta:</b></div><div class="prompt">❌ ${e[0]}</div><div class="smallPrompt"><b>¿Cuál es la frase correcta?</b></div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;
 answers(opts,e[1],nextRound)
}
function challenge(){
 count(`Reto ${round+1} / 10`);board.innerHTML=`<div class="prompt">⚡ ${current.challenges[round]}</div><div class="smallPrompt">Haz el reto en voz alta o con tu grupo.</div><button class="next" id="done">¡Hecho!</button>${progress(round+1)}`;document.getElementById('done').onclick=nextRound
}
function quiz(){
 count(`Pregunta ${round+1} / 10`);
 let item=(state.clues||CLUES[current.id])[round];
 let other=sh(CLUES[current.id].map(x=>x.answer).filter(x=>x!==item.answer)).slice(0,2);
 let opts=sh([item.answer,...other]);
 board.innerHTML=`<div class="smallPrompt"><b>¿Qué palabra corresponde a esta definición?</b></div><div class="prompt">${item.clue}</div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;
 answers(opts,item.answer,nextRound)
}
function code(){
 count(`Prueba ${round+1} / 10`);
 let secret=current.secret.padEnd(10,'X').slice(0,10).toUpperCase();
 let item=(state.clues||CLUES[current.id])[round];
 let other=sh(CLUES[current.id].map(x=>x.answer).filter(x=>x!==item.answer)).slice(0,2);
 let opts=sh([item.answer,...other]);
 let known=secret.split('').map((x,i)=>`<span class="letter">${i<round?x:'?'}</span>`).join('');
 board.innerHTML=`<div class="smallPrompt"><b>🔐 Pista ${round+1}</b></div><div class="prompt">${item.clue}</div><div class="answers"></div><div class="feedback"></div><div class="code">${known}</div>${progress(round+1)}`;
 answers(opts,item.answer,()=>{round++;if(round>=10){board.innerHTML=`<div class="result"><div class="big">🔓</div><h2>${secret}</h2><p>¡Código abierto!</p><button class="next" id="again">Jugar otra vez</button></div>`;count('Código abierto');document.getElementById('again').onclick=()=>startGame(game)}else renderRound()})
}
function special(){
 if(current.id===1) return renderWho();
 if(current.id===6) return renderMap();
 if(current.id===9) return renderDesk();
 count(`Ronda ${round+1} / 10`);
 let s=(state.specialRounds||SPECIAL[current.id])[round];
 board.innerHTML=`<div class="smallPrompt">${current.icon} <b>${current.special}</b></div><div class="prompt">${s.q}</div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;
 answers(sh(s.opts),s.a,nextRound)
}



function renderWho(){
 count(`Ronda ${round+1} / 10`);
 let roster=sh([...WHO_CHARACTERS]).map(p=>`<div class="personCard"><div class="charWrap"><img class="whoImg ${p.heightType}" src="${p.img}" alt="${p.name}"></div><b>${p.name}</b></div>`).join('');
 let s=(state.specialRounds||SPECIAL[1])[round];
 board.innerHTML=`<div class="smallPrompt">🕵️ <b>¿Quién es quién?</b></div><div class="roster">${roster}</div><div class="prompt">${s.q}</div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;
 answers(sh(s.opts),s.a,nextRound)
}
function renderMap(){
 count(`Ronda ${round+1} / 10`);
 let s=(state.mapRounds||MAP_ROUNDS)[round];
 let places=MAP_PLACES.map(p=>`<div class="place" style="left:${p.x}%;top:${p.y}%">${p.name}</div>`).join('');
 let start=MAP_PLACES.find(p=>p.name===s.start), end=MAP_PLACES.find(p=>p.name===s.end);
 board.innerHTML=`<div class="smallPrompt">🗺️ <b>BlaBla Maps</b></div>
 <div class="mapWrap">
   <div class="mapGrid">
     ${places}
     <div class="pinStart" style="left:${start.x}%;top:${start.y}%">📍</div>
     <div class="pinEnd" style="left:${end.x}%;top:${end.y}%">🎯</div>
   </div>
   <div class="mapLegend"><span>📍 Estás aquí: <b>${s.start}</b></span><span>🎯 Quieres ir a: <b>${s.end}</b></span></div>
 </div>
 <div class="prompt">${s.q}</div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;
 answers(sh(s.opts),s.a,nextRound)
}
function renderDesk(){
 count(`Ronda ${round+1} / 10`);
 let s=(state.deskRounds||DESK_ROUNDS)[round];
 board.innerHTML=`<div class="smallPrompt">🗂️ <b>Ventanilla 9</b></div>
 <div class="officeTop"><div class="ticket">TURNO<b>${s.ticket}</b></div><div class="windowDesk">VENTANILLA ${s.desk}</div></div>
 <div class="officeBubble">${s.bubble}</div>
 <div class="prompt">${s.q}</div><div class="answers"></div><div class="feedback"></div>${progress(round+1)}`;
 answers(sh(s.opts),s.a,nextRound)
}
document.getElementById('backUnits').onclick=()=>{show('units');scrollTo(0,0)};document.getElementById('backGames').onclick=()=>{show('games');scrollTo(0,0)};renderUnits();show('units');
})();
</script>
