<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlaBlaPlay</title>
<style>
:root{--yellow:#FFD400;--black:#0D0D0D;--paper:#F6F6F3;--white:#fff;--muted:#6c6c68}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--black);font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
button{font:inherit;cursor:pointer}img{display:block;max-width:100%}
.site{min-height:100vh;padding-bottom:40px}
.topbar,.inner,.footer,.levelNav,.loading{width:min(1180px,calc(100% - 36px));margin-inline:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px;gap:20px}
.homeLink{display:flex;align-items:center;gap:14px;background:transparent;border:0;color:var(--black);padding:0}
.homeLink img{width:58px;height:58px;object-fit:contain}
.brand{font-size:22px;font-weight:900}
.change{min-height:44px;border:3px solid var(--black);background:var(--yellow);color:var(--black);border-radius:999px;padding:10px 18px;font-weight:900;box-shadow:4px 4px 0 var(--black)}
.change:hover,.cta:hover,.levelCard:hover{transform:translateY(-2px)}
.stage{display:none}.stage.active{display:block}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;padding:30px 0 10px}
.hero h1{font-size:clamp(48px,7vw,88px);line-height:.92;letter-spacing:-5px;margin:0 0 16px} .play{background:var(--black);color:var(--yellow);border-radius:28px;padding:4px 18px 10px;display:inline-block}
.tagline{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px} .tagline span{background:#fff;border:2px solid var(--black);border-radius:999px;padding:8px 14px;font-size:14px}
.hero p{font-family:Arial,sans-serif;font-size:18px;line-height:1.55;color:var(--muted);max-width:680px;margin:0 0 24px}
.cta{min-height:52px;border:0;background:var(--black);color:var(--yellow);border-radius:18px;padding:12px 22px;font-weight:900;font-size:18px;box-shadow:5px 5px 0 var(--yellow)}
.logoPanel{display:grid;place-items:center;min-height:400px;background:#fff;border:3px solid var(--black);border-radius:36px;padding:26px;box-shadow:8px 8px 0 var(--yellow)}
.logoPanel img{width:min(440px,100%);height:auto;object-fit:contain}
.levelBlock{padding:14px 0 10px}
.levelGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.levelCard{min-height:320px;text-align:left;border:3px solid var(--black);border-radius:34px;background:#fff;padding:0;overflow:hidden;box-shadow:0 10px 0 rgba(13,13,13,.06)}
.levelVis{height:136px;display:flex;align-items:center;justify-content:center;font-size:60px;background:var(--black);color:var(--yellow)}
.levelCard:nth-child(2) .levelVis{background:var(--yellow);color:var(--black)}
.levelBody{padding:22px 22px 24px} .levelBody h2{font-size:42px;margin:0 0 10px;letter-spacing:-2px} .levelBody p{font:16px Arial,sans-serif;color:var(--muted);line-height:1.5;margin:0 0 18px}
.levelMeta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px} .chip{font:12px Arial,sans-serif;border:2px solid var(--black);border-radius:999px;padding:6px 10px;background:#fff8cc}
.pick{min-height:46px;border:2px solid var(--black);background:var(--yellow);color:var(--black);border-radius:14px;padding:10px 16px;font-weight:900}
.levelNav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:10px auto 0;padding-top:12px}
.levelNow{font:16px Arial,sans-serif;color:var(--muted)}
.loading{margin:30px auto;border:2px solid var(--black);border-radius:24px;background:#fff;padding:30px;text-align:center;font:16px Arial,sans-serif}
.loading strong{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-size:24px}
.frameWrap{width:min(1180px,calc(100% - 36px));margin:0 auto;background:transparent} iframe{width:100%;border:0;display:none;min-height:900px;background:transparent;border-radius:26px}
.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0 0;margin-top:24px;font:15px Arial,sans-serif;color:var(--muted)}
.footer img{height:58px;width:auto;object-fit:contain}
@media(max-width:900px){.hero,.levelGrid{grid-template-columns:1fr} .logoPanel{min-height:280px} }
@media(max-width:560px){.topbar,.inner,.footer,.levelNav,.loading,.frameWrap{width:min(100% - 24px,1180px)} .brand{font-size:18px} .homeLink img{width:48px;height:48px} .hero h1{letter-spacing:-4px} .footer{flex-direction:column;align-items:flex-start} }
</style>
</head>

  <section class="stage" id="stageLevels">
    <div class="inner levelBlock">
      <div class="levelGrid">
        <button class="levelCard" data-level="A1" type="button">
          <div class="levelVis">🌟</div>
          <div class="levelBody">
            <h2>A1</h2>
            <div class="levelMeta"><span class="chip">10 unidades</span><span class="chip">retos y juegos</span><span class="chip">vocabulario básico</span></div>
            <p>Para empezar a hablar: presentaciones, cuerpo, casa, compras, cumpleaños, ciudad, colegio, tecnología, trámites y trabajo.</p>
            <span class="pick">Entrar en A1</span>
          </div>
        </button>
        <button class="levelCard" data-level="A2" type="button">
          <div class="levelVis">⚡</div>
          <div class="levelBody">
            <h2>A2</h2>
            <div class="levelMeta"><span class="chip">10 unidades</span><span class="chip">misiones especiales</span><span class="chip">más conversación</span></div>
            <p>Para seguir avanzando con más autonomía, descripciones, situaciones cotidianas y juegos especiales como Ventanilla 9 o BlaBla Maps.</p>
            <span class="pick">Entrar en A2</span>
          </div>
        </button>
      </div>
    </div>
  </section>
  <section class="stage" id="stageApp">
    <div class="levelNav">
      <button class="change" id="changeLevel" type="button">← Cambiar de nivel</button>
      <div class="levelNow" id="levelNow">Elige tu nivel</div>
    </div>
    <div class="loading" id="loadingBox"><strong>Cargando nivel…</strong><br>Un momento.</div>
    <div class="frameWrap"><iframe id="levelFrame" title="BlaBlaPlay"></iframe></div>
  </section>
</main>
</div>
<script>
(function(){
  const stages={home:document.getElementById('stageHome'),levels:document.getElementById('stageLevels'),app:document.getElementById('stageApp')};
  const frame=document.getElementById('levelFrame');
  const loading=document.getElementById('loadingBox');
  const levelNow=document.getElementById('levelNow');
  let currentLevel='';
  function show(name){Object.entries(stages).forEach(([k,el])=>el.classList.toggle('active',k===name));window.scrollTo({top:0,behavior:'smooth'});}
  function unloadFrame(){frame.style.display='none'; frame.removeAttribute('src'); frame.style.height='900px';}
  function measureFrame(){
    try{
      const d=frame.contentDocument;
      if(!d) return;
      const h=Math.max(d.body?d.body.scrollHeight:0,d.documentElement?d.documentElement.scrollHeight:0);
      if(h>300) frame.style.height=Math.min(h+24,24000)+'px';
    }catch(e){}
  }
  function openLevel(level){
    currentLevel=level; show('app'); loading.style.display='block'; frame.style.display='none'; levelNow.textContent='Nivel '+level;
    unloadFrame();
    frame.onload=function(){loading.style.display='none'; frame.style.display='block'; setTimeout(measureFrame,200); setTimeout(measureFrame,900);};
    frame.src=level==='A1' ? 'payloadA1.html' : 'payloadA2.html';
  }
  document.getElementById('startBtn').addEventListener('click',()=>show('levels'));
  document.getElementById('topLevels').addEventListener('click',()=>{ if(stages.app.classList.contains('active')) document.getElementById('changeLevel').click(); else show('levels'); });
  document.getElementById('brandHome').addEventListener('click',()=>{ unloadFrame(); currentLevel=''; show('home'); });
  document.getElementById('changeLevel').addEventListener('click',()=>{ unloadFrame(); currentLevel=''; show('levels'); levelNow.textContent='Elige tu nivel'; });
  document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>openLevel(btn.dataset.level)));
  window.addEventListener('message',function(ev){ const d=ev.data; if(!d||d.type!=='blabla-height'||!d.height) return; if(currentLevel && d.level===currentLevel){ frame.style.height=Math.max(700,Math.min(Number(d.height)+30,24000))+'px'; frame.style.display='block'; loading.style.display='none'; } });
})();
</script>
